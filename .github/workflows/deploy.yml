name: deploy-shiny

on:
  push:
    branches: ["main"]

env:
  APP_NAME: ${{ github.event.repository.name }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Sjekk ut kode
        uses: actions/checkout@v6

      - name: Sett opp SSH
        run: |
          mkdir -p ~/.ssh
          umask 077
          printf '%s\n' "${{ secrets.SHINY_DEPLOY_KEY }}" | tr -d '\r' > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H dnsgrendel.grendel.no >> ~/.ssh/known_hosts

      - name: Synkroniser filer til server
        run: |
          rsync -avz --delete \
            --mkpath \
            -e "ssh -i ~/.ssh/id_rsa -o IdentitiesOnly=yes" \
            ./ \
            --chown=deployshiny:shinyapps \
            --chmod=D775,F664 \
            --exclude '.git' \
            --exclude '.env' \
            deployshiny@dnsgrendel.grendel.no:/srv/shiny-server/${{ env.APP_NAME }}/

      - name: Restart Shiny Server
        run: |
          ssh -i ~/.ssh/id_rsa -o IdentitiesOnly=yes deployshiny@dnsgrendel.grendel.no "sudo systemctl restart shiny-server"
